<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconcile It v0.1.8</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>:root{font-family:Inter,"PingFang SC",system-ui,sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px 64px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:26px;margin:0}.ver{font-size:11px;color:#777;background:#ecece7;border-radius:999px;padding:3px 7px;margin-left:7px}.sub,.muted{color:#888;font-size:13px}.sub{margin-top:5px}.privacy{font-size:12px;color:#52745b;background:#e8f1e9;padding:7px 11px;border-radius:999px}.panel,.stat{background:#fff;border:1px solid #e7e7e2;border-radius:16px}.panel{padding:20px;margin-bottom:16px}.drop{border:1.5px dashed #c9c9c1;border-radius:12px;padding:24px;text-align:center}.drop strong{display:block;margin-bottom:8px}.picker{display:block;width:100%;font-size:16px;padding:12px;background:#f7f7f4;border-radius:9px;border:1px solid #ddd}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{background:#f3f3ef;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4}.chip small{display:block;color:#777}.ok{color:#477052!important}.bad{color:#a33!important}.status{font-size:12px;color:#777;margin-top:10px}.actions{display:flex;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:600}.primary{background:#20201e;color:#fff}.secondary{background:#efefeb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px}.num{font-size:25px;font-weight:700;margin-top:5px}.tabs{display:flex;gap:5px;margin-bottom:12px}.tab{background:transparent;color:#666}.tab.active{background:#e9e9e4;color:#111}.tx{display:grid;grid-template-columns:135px 100px 1fr 150px 90px;gap:8px;align-items:center;border-top:1px solid #eee;padding:13px 4px;font-size:13px}.amount{font-weight:700}.source{display:inline-block;padding:3px 7px;background:#f0f0ec;border-radius:6px;font-size:11px;margin:2px}.matched{color:#477052}.missing{color:#a33}.ambiguous{color:#9a6b22}.empty{text-align:center;padding:40px;color:#999}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.privacy{display:none}.tx{grid-template-columns:100px 85px 1fr}.tx>*:nth-child(4),.tx>*:nth-child(5){display:none}}</style></head>
<body><div class="wrap"><header><div><h1>Reconcile It <span class="ver">v0.1.8</span></h1><div class="sub">多源流水对账，不再造一本账。</div></div><div class="privacy">● Local only · 文件不会上传</div></header>
<section class="panel"><div class="drop"><strong>选择账单文件</strong><input id="picker" class="picker" type="file" multiple accept=".pdf,.csv,.xls,.xlsx,application/pdf"><div class="muted" style="margin-top:8px">钱迹 / 支付宝 / 微信 / 银行 · PDF / CSV / XLS / XLSX</div><div id="pickStatus" class="status">尚未选择文件</div></div><div id="files" class="files"></div><div class="actions"><button id="run" class="primary">开始对账</button><button id="clear" class="secondary">清空</button></div></section>
<section class="stats"><div class="stat"><span class="muted">原始记录</span><div id="rawN" class="num">0</div></div><div class="stat"><span class="muted">交易簇</span><div id="clusterN" class="num">0</div></div><div class="stat"><span class="muted">已匹配</span><div id="matchedN" class="num">0</div></div><div class="stat"><span class="muted">待处理</span><div id="missingN" class="num">0</div></div></section>
<section class="panel" style="margin-top:16px"><div class="tabs"><button class="tab active" data-filter="missing">待处理</button><button class="tab" data-filter="ambiguous">疑似</button><button class="tab" data-filter="matched">已匹配</button><button class="tab" data-filter="all">全部</button></div><div id="results" class="empty">导入账单后开始对账</div></section></div>
<script>
window.__pickedFiles=[];window.__fileStats={};
(function(){var p=document.getElementById('picker'),box=document.getElementById('files'),st=document.getElementById('pickStatus');function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}window.__showFiles=function(){var a=window.__pickedFiles,html=[];for(var i=0;i<a.length;i++){var f=a[i],s=window.__fileStats[f.name+':'+f.size];html.push('<span class="chip">'+esc(f.name)+' · '+Math.round(f.size/1024)+' KB'+(s?'<small class="'+(s.ok?'ok':'bad')+'">'+esc(s.text)+'</small>':'')+'</span>')}box.innerHTML=html.join('');st.textContent=a.length?'已选择 '+a.length+' 个文件':'尚未选择文件'};p.onchange=function(){var fs=p.files;if(!fs||!fs.length){st.textContent='文件选择器返回了 0 个文件';return}for(var i=0;i<fs.length;i++){var dup=false;for(var j=0;j<window.__pickedFiles.length;j++)if(window.__pickedFiles[j].name===fs[i].name&&window.__pickedFiles[j].size===fs[i].size)dup=true;if(!dup)window.__pickedFiles.push(fs[i])}window.__showFiles()};window.__clearPicked=function(){window.__pickedFiles=[];window.__fileStats={};p.value='';window.__showFiles()};window.addEventListener('error',function(e){st.textContent='页面脚本错误：'+(e.message||'unknown')})})();
</script>
<script>
(function(){var $=function(x){return document.getElementById(x)},S={tx:[],clusters:[],filter:'missing'};function clean(x){return String(x==null?'':x).replace(/\s+/g,'').replace(/[：:]/g,'').trim()}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function source(name,text){var s=(name+' '+(text||'')).toLowerCase();if(s.indexOf('微信')>=0||s.indexOf('wechat')>=0||s.indexOf('财付通')>=0)return'wechat';if(s.indexOf('支付宝')>=0||s.indexOf('alipay')>=0)return'alipay';if(s.indexOf('钱迹')>=0||s.indexOf('qianji')>=0)return'qianji';return'bank'}function money(v){var n=Number(String(v==null?'':v).replace(/[￥¥,元\s]/g,''));return isFinite(n)?n:null}function date(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'&&v>20000&&window.XLSX){var d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0))}var s=String(v==null?'':v).trim().replace(/[年月]/g,'/').replace('日','').replace(/\./g,'/'),m=s.match(/(20\d{2})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)):null}function val(r,re){for(var k in r)if(re.test(clean(k)))return r[k]}function make(r,src,file,time,amount,dir,desc){var d=date(time),n=money(amount);if(!d||n===null||n===0)return null;var ds=String(dir||'');if(/不计收支/.test(ds))return null;var a=Math.abs(n);if(/支出|付款|消费|借方/.test(ds))a=-a;else if(/收入|收款|贷方/.test(ds))a=Math.abs(a);else a=n;return{source:src,file:file,time:d,amount:Math.round(a*100)/100,desc:String(desc||'')}}function header(m){for(var i=0;i<Math.min(100,m.length);i++){var c=(m[i]||[]).map(clean);if(c.some(function(x){return/交易时间|日期|时间/.test(x)})&&c.some(function(x){return/金额/.test(x)}))return i}return-1}function objects(m,i){var h=m[i].map(function(x,j){return clean(x)||'__'+j});return m.slice(i+1).map(function(r){var o={};h.forEach(function(x,j){o[x]=r[j]==null?'':r[j]});return o})}function csvText(buf){var b=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){}try{return new TextDecoder('gb18030').decode(b)}catch(e){}return new TextDecoder().decode(b)}
async function parseSheet(f){if(!window.XLSX)throw new Error('XLSX 组件未加载');var buf=await f.arrayBuffer(),csv=/\.csv$/i.test(f.name),wb=csv?XLSX.read(csvText(buf),{type:'string',raw:true}):XLSX.read(buf,{type:'array',raw:true,cellDates:true}),all=[],src='bank',found=false;for(var si=0;si<wb.SheetNames.length;si++){var sh=wb.Sheets[wb.SheetNames[si]],m=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:true});src=source(f.name,m.slice(0,50).reduce(function(a,r){return a.concat(r)},[]).join(' '));var hi=header(m);if(hi<0)continue;found=true;var rows=objects(m,hi);for(var ri=0;ri<rows.length;ri++){var r=rows[ri],tm,am,di,de;if(src==='wechat'){tm=val(r,/^交易时间$/);am=val(r,/^金额(?:\(元\)|（元）|元)?$/);di=val(r,/^收\/?支$|^收支$/);de=[val(r,/^交易对方$/),val(r,/^商品$/)].filter(Boolean).join(' · ')}else if(src==='alipay'){tm=val(r,/^交易时间$/);am=val(r,/^金额(?:\(元\)|（元）|元)?$/);di=val(r,/^收\/?支$|^收支$/);de=[val(r,/^交易对方$/),val(r,/^商品说明$/)].filter(Boolean).join(' · ')}else{tm=val(r,/交易时间|付款时间|创建时间|日期|^时间$/);am=val(r,/交易金额|支出金额|收入金额|^金额/);di=val(r,/收\/?支|收支|类型/);de=[val(r,/交易对方|商户|对方|名称/),val(r,/商品|备注|说明|摘要/)].filter(Boolean).join(' · ')}var t=make(r,src,f.name,tm,am,di,de);if(t)all.push(t)}}return{source:src,items:all,note:found?'已定位表头':'未找到表头'}}
async function parsePdf(f){var pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';var pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(var p=1;p<=pdf.numPages;p++){var page=await pdf.getPage(p),c=await page.getTextContent(),it=c.items.filter(function(x){return x.str&&x.str.trim()}).map(function(x){return{s:x.str.trim(),x:x.transform[4],y:x.transform[5]}}).sort(function(a,b){return Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x}),rows=[],row=[],y=null;for(var i=0;i<it.length;i++){if(y!==null&&Math.abs(it[i].y-y)>2){rows.push(row.join(' '));row=[]}row.push(it[i].s);y=it[i].y}if(row.length)rows.push(row.join(' '));for(var j=0;j<rows.length;j++){var line=rows[j],dm=line.match(/20\d{2}[\-\/.年]\d{1,2}[\-\/.月]\d{1,2}(?:日)?(?:\s+\d{1,2}[:：]\d{2}(?::\d{2})?)?/),mm=line.match(/[-+]?\s*[¥￥]?\s*(?:\d{1,3}(?:,\d{3})*|\d+)\.\d{2}/g);if(!dm||!mm||!mm.length)continue;var n=money(mm[0]);if(n===null)continue;if(/支出|消费|付款|借方/.test(line))n=-Math.abs(n);else if(/收入|收款|贷方/.test(line))n=Math.abs(n);out.push({source:'bank',file:f.name,time:date(dm[0].replace(/：/g,':')),amount:Math.round(n*100)/100,desc:line})}}return{source:'bank/pdf',items:out,note:'文本 PDF'}}
async function parseFile(f){return/\.pdf$/i.test(f.name)?parsePdf(f):parseSheet(f)}
function cluster(tx){var a=tx.slice().sort(function(x,y){return x.time-y.time}),g=[];for(var ai=0;ai<a.length;ai++){var t=a[ai],best=null,bd=Infinity;for(var i=g.length-1;i>=0;i--){var x=g[i],d=Math.abs(t.time-x.anchor.time);if(d>86400000&&t.time>x.anchor.time)break;if(Math.abs(t.amount-x.anchor.amount)<.001&&d<=3600000&&d<bd&&!x.items.some(function(z){return z.source===t.source})){best=x;bd=d}}if(best)best.items.push(t);else g.push({anchor:t,items:[t]})}return g.map(function(x){var q=x.items.some(function(z){return z.source==='qianji'}),e=x.items.some(function(z){return z.source!=='qianji'});x.status=q&&e?'matched':!q&&e?'missing':'ambiguous';return x})}
function render(){var c=S.clusters;$('rawN').textContent=S.tx.length;$('clusterN').textContent=c.length;$('matchedN').textContent=c.filter(function(x){return x.status==='matched'}).length;$('missingN').textContent=c.filter(function(x){return x.status!=='matched'}).length;var a=c.filter(function(x){return S.filter==='all'||x.status===S.filter});$('results').className=a.length?'':'empty';$('results').innerHTML=a.length?a.map(function(g){var x=g.anchor;return'<div class="tx"><span>'+(x.time.getMonth()+1)+'/'+x.time.getDate()+' '+String(x.time.getHours()).padStart(2,'0')+':'+String(x.time.getMinutes()).padStart(2,'0')+'</span><span class="amount">'+(x.amount<0?'-':'+')+'¥'+Math.abs(x.amount).toFixed(2)+'</span><span>'+esc(x.desc||'无描述')+'</span><span>'+g.items.map(function(z){return'<span class="source">'+esc(z.source)+'</span>'}).join('')+'</span><span class="'+g.status+'">'+({matched:'已匹配',missing:'待处理',ambiguous:'疑似'}[g.status])+'</span></div>'}).join(''):'没有这一类交易'}
$('clear').onclick=function(){window.__clearPicked();S.tx=[];S.clusters=[];render()};$('run').onclick=async function(){var fs=window.__pickedFiles.slice(),st=$('pickStatus');if(!fs.length){st.textContent='没有收到文件，请先选择';return}S.tx=[];window.__fileStats={};for(var i=0;i<fs.length;i++){var f=fs[i],k=f.name+':'+f.size;st.textContent='正在读取 '+(i+1)+'/'+fs.length+'：'+f.name;try{var r=await parseFile(f);S.tx=S.tx.concat(r.items);window.__fileStats[k]={ok:r.items.length>0,text:r.source+' · 解析 '+r.items.length+' 条 · '+r.note}}catch(e){window.__fileStats[k]={ok:false,text:'读取失败：'+(e.message||'未知错误')}}window.__showFiles()}S.clusters=cluster(S.tx);st.textContent='读取完成：'+S.tx.length+' 条记录';render()};document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');S.filter=b.getAttribute('data-filter');render()}});render()})();
</script></body></html>
