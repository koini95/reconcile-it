<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconcile It v0.2.1</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{font-family:Inter,"PingFang SC",system-ui,sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:26px;margin:0}.ver{font-size:11px;color:#777;background:#ecece7;border-radius:999px;padding:3px 7px}.sub,.muted{color:#888;font-size:13px}.panel,.stat{background:#fff;border:1px solid #e7e7e2;border-radius:16px}.panel{padding:18px;margin-bottom:16px}.drop{border:1.5px dashed #c9c9c1;border-radius:12px;padding:20px;text-align:center}.picker{display:block;width:100%;font-size:16px;padding:11px;background:#f7f7f4;border:1px solid #ddd;border-radius:9px}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{background:#f3f3ef;border-radius:8px;padding:8px 10px;font-size:12px}.chip small{display:block}.ok{color:#477052}.bad{color:#a33}.status{font-size:12px;color:#777;margin-top:8px}.actions,.tabs{display:flex;gap:8px;margin-top:14px;align-items:center}button{border:0;border-radius:9px;padding:10px 14px;font-weight:600}.primary{background:#20201e;color:#fff}.secondary,.tab{background:#efefeb}.tab.active{background:#20201e;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px}.num{font-size:25px;font-weight:700;margin-top:4px}.tableWrap{overflow:auto;border:1px solid #ecece7;border-radius:12px;margin-top:14px;max-height:70vh}.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:1050px;font-size:12px}.matrix th{position:sticky;top:0;z-index:3;background:#f5f5f1;text-align:left;padding:10px;border-bottom:1px solid #ddd}.matrix td{padding:9px 10px;border-bottom:1px solid #e pan><div id="missingN" class="num">0</div></div></section><section class="panel" style="margin-top:16px"><div class="tabs"><button class="tab active" data-filter="missing">钱迹缺失</button><button class="tab" data-filter="matched">已匹配</button><button class="tab" data-filter="all">全部</button><span class="shortcut">快捷指令名 <input id="shortcutName" value="Reconcile It 补录"></span></div><div id="results" class="empty">导入账单后开始对账</div></section></div><script>window.__pickedFiles=[];window.__fileStats={};(function(){var p=document.getElementById('picker'),box=document.getElementById('files'),st=document.getElementById('pickStatus');function e(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}window.__showFiles=function(){box.innerHTML=window.__pickedFiles.map(function(f){var s=window.__fileStats[f.name+':'+f.size];return'<span class="chip">'+e(f.name)+' · '+Math.round(f.size/1024)+' KB'+(s?'<small class="'+(s.ok?'ok':'bad')+'">'+e(s.text)+'</small>':'')+'</span>'}).join('');st.textContent=window.__pickedFiles.length?'已选择 '+window.__pickedFiles.length+' 个文件':'尚未选择文件'};p.onchange=function(){for(var i=0;i<(p.files||[]).length;i++){var f=p.files[i];if(!window.__pickedFiles.some(function(x){return x.name===f.name&&x.size===f.size}))window.__pickedFiles.push(f)}window.__showFiles()};window.__clearPicked=function(){window.__pickedFiles=[];window.__fileStats={};p.value='';window.__showFiles()}})();(function(){var $=function(x){return document.getElementById(x)},S={tx:[],clusters:[],filter:'missing',sent:{}};function clean(x){return String(x==null?'':x).replace(/\s+/g,'').replace(/[：:]/g,'').trim()}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function source(name,text){var n=String(name||'').toLowerCase(),s=(n+' '+(text||'')).toLowerCase();if(n.indexOf('qianji')>=0||n.indexOf('钱迹')>=0)return'qianji';if(n.indexOf('微信')>=0||n.indexOf('wechat')>=0||s.indexOf('财付通')>=0)return'wechat';if(n.indexOf('支付宝')>=0||n.indexOf('alipay')>=0)return'alipay';if(s.indexOf('qianji')>=0||s.indexOf('钱迹')>=0)return'qianji';if(s.indexOf('微信')>=0||s.indexOf('wechat')>=0)return'wechat';if(s.indexOf('支付宝')>=0||s.indexOf('alipay')>=0)return'alipay';return'bank'}function money(v){var n=Number(String(v==null?'':v).replace(/[￥¥,元\s]/g,''));return isFinite(n)?n:null}function date(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'&&v>20000){var d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0))}var s=String(v||'').trim().replace(/[年月]/g,'/').replace('日','').replace(/\./g,'/').replace(/：/g,':'),m=s.match(/(20\d{2})[\/-](\d{1,2})[\/-](\d{1,2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));m=s.match(/(20\d{2})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}function val(r,re){for(var k in r)if(re.test(clean(k)))return r[k]}function make(src,file,time,amount,dir,desc,account){var d=date(time),n=money(amount);if(!d||n===null||n===0)return null;var ds=String(dir||'');if(/不计收支/.test(ds))return null;var a=Math.abs(n);if(/支出|付款|消费|借方/.test(ds))a=-a;else if(/收入|收款|贷方/.test(ds))a=Math.abs(a);else a=n;return{source:src,file:file,time:d,amount:Math.round(a*100)/100,desc:String(desc||''),account:String(account||'')}}function header(m){for(var i=0;i<Math.min(100,m.length);i++){var c=(m[i]||[]).map(clean);if(c.some(function(x){return/交易时间|日期|时间/.test(x)})&&c.some(function(x){return/金额/.test(x)}))return i}return-1}function objects(m,i){var h=m[i].map(function(x,j){return clean(x)||'__'+j});return m.slice(i+1).map(function(r){var o={};h.forEach(function(x,j){o[x]=r[j]==null?'':r[j]});return o})}function csvText(buf){var b=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){}try{return new TextDecoder('gb18030').decode(b)}catch(e){}return new TextDecoder().decode(b)}async function parseSheet(f){var buf=await f.arrayBuffer(),csv=/\.csv$/i.test(f.name),wb=csv?XLSX.read(csvText(buf),{type:'string',raw:true,cellDates:false}):XLSX.read(buf,{type:'array',raw:true,cellDates:true}),all=[],src=source(f.name,''),found=false;for(var si=0;si<wb.SheetNames.length;si++){var m=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,defval:'',raw:true}),det=source(f.name,m.slice(0,50).reduce(function(a,r){return a.concat(r)},[]).join(' '));if(src==='bank'||det==='qianji')src=det;var hi=header(m);if(hi<0)continue;found=true;objects(m,hi).forEach(function(r){var tm,am,di,de,ac;if(src==='qianji'){tm=val(r,/^时间$/);am=val(r,/^金额$/);di=val(r,/^类型$/);ac=val(r,/^账户1$/);de=[val(r,/^备注$/),val(r,/^分类$/),val(r,/^二级分类$/)].filter(Boolean).join(' · ')}else if(src==='wechat'){tm=val(r,/^交易时间$/);am=val(r,/^金额(?:\(元\)|（元）|元)?$/);di=val(r,/^收\/?支$|^收支$/);ac=val(r,/^支付方式$/);de=[val(r,/^交易对方$/),val(r,/^商品$/)].filter(Boolean).join(' · ')}else if(src==='alipay'){tm=val(r,/^交易时间$/);am=val(r,/^金额(?:\(元\)|（元）|元)?$/);di=val(r,/^收\/?支$|^收支$/);ac=val(r,/收\/付款方式|付款方式/);de=[val(r,/^交易对方$/),val(r,/^商品说明$/)].filter(Boolean).join(' · ')}else{tm=val(r,/交易时间|日期|^时间$/);am=val(r,/交易金额|支出金额|收入金额|^金额/);di=val(r,/收\/?支|收支|类型/);de=[val(r,/交易对方|商户|对方|名称/),val(r,/商品|备注|说明|摘要/)].filter(Boolean).join(' · ')}var t=make(src,f.name,tm,am,di,de,ac);if(t)all.push(t)})}return{source:src,items:all,note:found?'已定位表头':'未找到表头'}}async function parsePdf(f){var pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';var pdf=await pdfjs.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(var p=1;p<=pdf.numPages;p++){var page=await pdf.getPage(p),c=await page.getTextContent(),it=c.items.filter(function(x){return x.str&&x.str.trim()}).map(function(x){return{s:x.str.trim(),x:x.transform[4],y:x.transform[5]}}).sort(function(a,b){return Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x}),rows=[],row=[],y=null;it.forEach(function(i){if(y!==null&&Math.abs(i.y-y)>2){rows.push(row.join(' '));row=[]}row.push(i.s);y=i.y});if(row.length)rows.push(row.join(' '));rows.forEach(function(line){var dm=line.match(/20\d{2}[\-\/.年]\d{1,2}[\-\/.月]\d{1,2}(?:日)?(?:\s+\d{1,2}[:：]\d{2}(?::\d{2})?)?/),mm=line.match(/[-+]?\s*[¥￥]?\s*(?:\d{1,3}(?:,\d{3})*|\d+)\.\d{2}/g);if(!dm||!mm||!mm.length)return;var n=money(mm[0]);if(/支出|消费|付款|借方/.test(line))n=-Math.abs(n);else if(/收入|收款|贷方/.test(line))n=Math.abs(n);var d=date(dm[0]);if(d&&n!==null)out.push({source:'bank',file:f.name,time:d,amount:Math.round(n*100)/100,desc:line,account:'招商银行'})})}return{source:'bank/pdf',items:out,note:'文本 PDF'}}async function parseFile(f){return/\.pdf$/i.test(f.name)?parsePdf(f):parseSheet(f)}function cluster(tx){var a=tx.slice().sort(function(x,y){return x.time-y.time}),g=[];a.forEach(function(t){var best=null,bd=Infinity;for(var i=g.length-1;i>=0;i--){var x=g[i],d=Math.abs(t.time-x.anchor.time);if(d>86400000&&t.time>x.anchor.time)break;if(Math.abs(t.amount-x.anchor.amount)<.001&&d<=3600000&&d<bd&&!x.items.some(function(z){return z.source===t.source})){best=x;bd=d}}best?best.items.push(t):g.push({anchor:t,items:[t]})});return g.map(function(x,i){var q=x.items.some(function(z){return z.source==='qianji'}),e=x.items.some(function(z){return z.source!=='qianji'});x.status=q&&e?'matched':!q&&e?'missing':'ambiguous';x.id=i+'-'+x.anchor.time.getTime()+'-'+x.anchor.amount;return x})}function cell(g,src){var a=g.items.filter(function(x){return x.source===src});if(!a.length)return'<span class="emptyCell">—</span>';return a.map(function(x){return'<div class="cellMain">'+(x.amount<0?'-':'+')+'¥'+Math.abs(x.amount).toFixed(2)+'</div><div class="cellSub">'+esc(x.desc||x.account||'')+'</div>'}).join('')}function payload(g){var x=g.items.filter(function(z){return z.source!=='bank'})[0]||g.anchor;return{amount:Math.abs(x.amount),direction:x.amount<0?'支出':'收入',time:x.time.getFullYear()+'-'+String(x.time.getMonth()+1).padStart(2,'0')+'-'+String(x.time.getDate()).padStart(2,'0')+' '+String(x.time.getHours()).padStart(2,'0')+':'+String(x.time.getMinutes()).padStart(2,'0')+':'+String(x.time.getSeconds()).padStart(2,'0'),account:x.account||'',note:x.desc||'',source:x.source}}window.__book=function(id){var g=S.clusters.find(function(x){return x.id===id});if(!g)return;var name=$('shortcutName').value.trim()||'Reconcile It 补录',data=JSON.stringify(payload(g));S.sent[id]=(S.sent[id]||0)+1;render();location.href='shortcuts://run-shortcut?name='+encodeURIComponent(name)+'&input=text&text='+encodeURIComponent(data)};function render(){var c=S.clusters,missing=c.filter(function(x){return x.status==='missing'});$('rawN').textContent=S.tx.length;$('clusterN').textContent=c.length;$('matchedN').textContent=c.filter(function(x){return x.status==='matched'}).length;$('missingN').textContent=missing.length;var a=c.filter(function(x){return S.filter==='all'||x.status===S.filter});if(!a.length){$('results').className='empty';$('results').innerHTML='没有这一类交易';return}$('results').className='';$('results').innerHTML='<div class="tableWrap"><table class="matrix"><thead><tr><th class="meta">时间 / 金额</th><th>钱迹</th><th>支付宝</th><th>微信</th><th>招商银行</th><th>操作</th></tr></thead><tbody>'+a.map(function(g){var x=g.anchor,n=S.sent[g.id]||0,miss=g.status==='missing';return'<tr class="'+(miss?'missingQ':'')+'"><td class="meta"><b>'+(x.time.getMonth()+1)+'/'+x.time.getDate()+' '+String(x.time.getHours()).padStart(2,'0')+':'+String(x.time.getMinutes()).padStart(2,'0')+':'+String(x.time.getSeconds()).padStart(2,'0')+'</b><div class="cellMain">'+(x.amount<0?'-':'+')+'¥'+Math.abs(x.amount).toFixed(2)+'</div></td><td>'+cell(g,'qianji')+'</td><td>'+cell(g,'alipay')+'</td><td>'+cell(g,'wechat')+'</td><td>'+cell(g,'bank')+'</td><td class="action">'+(miss?'<button class="book '+(n?'sent':'')+'" onclick="__book(\''+g.id+'\')">'+(n?'再次补录':'补录钱迹')+'</button>'+(n?'<div class="sentNote">已发起 '+n+' 次</div>':''):'✓')+'</td></tr>'}).join('')+'</tbody></table></div>'}$('clear').onclick=function(){window.__clearPicked();S.tx=[];S.clusters=[];S.sent={};render()};$('run').onclick=async function(){var fs=window.__pickedFiles.slice(),st=$('pickStatus');if(!fs.length)return;S.tx=[];S.sent={};window.__fileStats={};for(var i=0;i<fs.length;i++){var f=fs[i],k=f.name+':'+f.size;st.textContent='正在读取 '+(i+1)+'/'+fs.length+'：'+f.name;try{var r=await parseFile(f);S.tx=S.tx.concat(r.items);window.__fileStats[k]={ok:r.items.length>0,text:r.source+' · 解析 '+r.items.length+' 条 · '+r.note}}catch(e){window.__fileStats[k]={ok:false,text:'读取失败：'+(e.message||'未知错误')}}window.__showFiles()}S.clusters=cluster(S.tx);st.textContent='读取完成：'+S.tx.length+' 条记录';render()};document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');S.filter=b.getAttribute('data-filter');render()}});render()})();</script></body></html>
