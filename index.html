<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reconcile It</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{font-family:Inter,"PingFang SC",system-ui,sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px 64px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:26px;margin:0}.sub{color:#737373;font-size:13px;margin-top:5px}.privacy{font-size:12px;color:#52745b;background:#e8f1e9;padding:7px 11px;border-radius:999px}.panel{background:white;border:1px solid #e7e7e2;border-radius:16px;padding:20px;margin-bottom:16px}.drop{border:1.5px dashed #c9c9c1;border-radius:12px;padding:32px;text-align:center;cursor:pointer}.drop.drag{background:#f1f4ee}.drop strong{display:block;margin-bottom:6px}.muted{color:#888;font-size:13px}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{background:#f3f3ef;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.35}.chip small{display:block;color:#777;margin-top:2px}.ok{color:#477052}.bad{color:#a33}.actions{display:flex;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#20201e;color:white}.secondary{background:#efefeb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid #e7e7e2;border-radius:13px;padding:16px}.num{font-size:25px;font-weight:700;margin-top:5px}.tabs{display:flex;gap:5px;margin-bottom:12px}.tab{background:transparent;color:#666}.tab.active{background:#e9e9e4;color:#111}.tx{display:grid;grid-template-columns:150px 110px 1fr 170px 130px;align-items:center;border-top:1px solid #eee;padding:13px 4px;font-size:13px}.amount{font-weight:700;font-variant-numeric:tabular-nums}.source{display:inline-block;padding:3px 7px;background:#f0f0ec;border-radius:6px;font-size:11px;margin-right:4px}.status{font-size:12px}.missing{color:#a33}.matched{color:#477052}.ambiguous{color:#9a6b22}.empty{text-align:center;padding:40px;color:#999}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tx{grid-template-columns:100px 80px 1fr}.tx>*:nth-child(4),.tx>*:nth-child(5){display:none}.privacy{display:none}}
  </style>
</head>
<body>
<div class="wrap">
<header><div><h1>Reconcile It</h1><div class="sub">多源流水对账，不再造一本账。</div></div><div class="privacy">● Local only · 文件不会上传</div></header>
<section class="panel">
  <div id="drop" class="drop"><strong>把账单都拖进来</strong><span class="muted">钱迹 / 支付宝 / 微信 / 银行 · PDF / CSV / XLS / XLSX</span><input id="picker" type="file" multiple accept=".pdf,.csv,.xls,.xlsx,application/pdf" hidden></div>
  <div id="files" class="files"></div>
  <div class="actions"><button id="run" class="primary">开始对账</button><button id="clear" class="secondary">清空</button></div>
</section>
<section class="stats">
  <div class="stat"><span class="muted">原始记录</span><div id="rawN" class="num">0</div></div><div class="stat"><span class="muted">交易簇</span><div id="clusterN" class="num">0</div></div><div class="stat"><span class="muted">已匹配</span><div id="matchedN" class="num">0</div></div><div class="stat"><span class="muted">待处理</span><div id="missingN" class="num">0</div></div>
</section>
<section class="panel" style="margin-top:16px"><div class="tabs"><button class="tab active" data-filter="missing">待处理</button><button class="tab" data-filter="ambiguous">疑似</button><button class="tab" data-filter="matched">已匹配</button><button class="tab" data-filter="all">全部</button></div><div id="results" class="empty">导入账单后开始对账</div></section>
</div>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const state={files:[],fileStats:{},transactions:[],clusters:[],filter:'missing'};const $=id=>document.getElementById(id);const drop=$('drop'),picker=$('picker');
drop.onclick=()=>picker.click();picker.onchange=e=>addFiles(e.target.files);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
const fileKey=f=>`${f.name}:${f.size}`;
function addFiles(fs){for(const f of fs)if(!state.files.some(x=>fileKey(x)===fileKey(f)))state.files.push(f);renderFiles()}
function renderFiles(){$('files').innerHTML=state.files.map(f=>{const st=state.fileStats[fileKey(f)];return `<span class="chip">${esc(f.name)}${st?`<small class="${st.count?'ok':'bad'}">${esc(st.source)} · 解析 ${st.count} 条${st.note?` · ${esc(st.note)}`:''}</small>`:''}</span>`}).join('')}
$('clear').onclick=()=>{state.files=[];state.fileStats={};state.transactions=[];state.clusters=[];renderFiles();render()};
$('run').onclick=async()=>{state.transactions=[];state.fileStats={};for(const f of state.files){try{const parsed=await parseFile(f);state.transactions.push(...parsed.items);state.fileStats[fileKey(f)]={source:parsed.source,count:parsed.items.length,note:parsed.note||''}}catch(e){console.warn(f.name,e);state.fileStats[fileKey(f)]={source:'读取失败',count:0,note:e.message||'未知错误'}}renderFiles()}state.clusters=cluster(state.transactions);render()};
function sourceFrom(name,text=''){const s=(name+' '+text).toLowerCase();if(s.includes('支付宝')||s.includes('alipay'))return'alipay';if(s.includes('微信')||s.includes('wechat')||s.includes('财付通'))return'wechat';if(s.includes('钱迹')||s.includes('qianji'))return'qianji';return'bank'}
const cleanHeader=v=>String(v??'').replace(/\s+/g,'').replace(/[：:]/g,'').trim();
function findHeaderRow(matrix){for(let i=0;i<Math.min(matrix.length,80);i++){const cells=(matrix[i]||[]).map(cleanHeader);const hasTime=cells.some(x=>/交易时间|付款时间|创建时间|日期|时间/.test(x));const hasAmount=cells.some(x=>/金额/.test(x));if(hasTime&&hasAmount)return i}return -1}
function matrixToObjects(matrix,headerIndex){const headers=(matrix[headerIndex]||[]).map((h,i)=>cleanHeader(h)||`__col${i}`);return matrix.slice(headerIndex+1).map(row=>{const o={};headers.forEach((h,i)=>o[h]=row?.[i]??'');return o}).filter(o=>Object.values(o).some(v=>String(v).trim()!==''))}
function decodeCsv(buf){const bytes=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{}try{return new TextDecoder('gb18030').decode(bytes)}catch{}return new TextDecoder().decode(bytes)}
async function parseFile(file){if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){const items=await parsePdf(file);return{source:'bank/pdf',items,note:'文本型 PDF'}}
  const buf=await file.arrayBuffer(),isCsv=file.name.toLowerCase().endsWith('.csv');const wb=isCsv?XLSX.read(decodeCsv(buf),{type:'string',cellDates:true}):XLSX.read(buf,{type:'array',cellDates:true});let out=[],detected='bank',foundHeader=false;
  for(const sn of wb.SheetNames){const matrix=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});const preview=matrix.slice(0,40).flat().join(' ');const source=sourceFrom(file.name,preview);detected=source;const hi=findHeaderRow(matrix);let rows;if(hi>=0){foundHeader=true;rows=matrixToObjects(matrix,hi)}else{rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false})}
    for(const r of rows){const t=normalize(r,source,file.name);if(t)out.push(t)}}
  return{source:detected,items:out,note:foundHeader?'已定位真实表头':'未找到标准表头，使用兼容模式'}
}
async function parsePdf(file){const data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjsLib.getDocument({data}).promise;let lines=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),content=await page.getTextContent();const items=content.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);let row=[],lastY=null;for(const i of items){if(lastY!==null&&Math.abs(i.y-lastY)>2){lines.push(row.join(' '));row=[]}row.push(i.s);lastY=i.y}if(row.length)lines.push(row.join(' '))}const text=lines.join('\n'),source=sourceFrom(file.name,text.slice(0,3000));return parsePdfLines(lines,source,file.name)}
function parsePdfLines(lines,source,file){const out=[];const dateRe=/(20\d{2}[\-\/.年]\d{1,2}[\-\/.月]\d{1,2}(?:日)?(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)/;const moneyRe=/[-+]?\s*[¥￥]?\s*(\d{1,3}(?:,\d{3})*|\d+)(?:\.\d{2})/g;for(const line of lines){const dm=line.match(dateRe);if(!dm)continue;const ms=[...line.matchAll(moneyRe)].map(m=>({raw:m[0],n:Number(m[0].replace(/[¥￥,+\s]/g,''))})).filter(x=>Number.isFinite(x.n));if(!ms.length)continue;let amount=ms[0].n;if(/支出|消费|付款|借方|debit/i.test(line)&&amount>0)amount=-amount;else if(/收入|入账|贷方|credit/i.test(line))amount=Math.abs(amount);const d=parseDate(dm[1]);if(!d)continue;out.push({source,file,time:d,amount:Math.round(amount*100)/100,desc:line.replace(dm[0],'').trim(),raw:line})}return out}
function parseDate(v){if(v instanceof Date&&!isNaN(v))return v;const s=String(v??'').trim().replace(/[年月]/g,'/').replace('日','').replace(/\./g,'/');const m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);if(!m)return null;const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));return isNaN(d)?null:d}
function normalize(row,source,file){const entries=Object.entries(row).map(([k,v])=>[cleanHeader(k),v]);const find=re=>entries.find(([k])=>re.test(k))?.[1];let time=find(/交易时间|付款时间|创建时间|日期|^时间$/i);let amount=find(/交易金额|支出金额|收入金额|金额(?:元)?$/i);let direction=find(/收\/?支|收支|交易类型|类型|direction/i)||'';const counterparty=find(/交易对方|商户|对方|名称/i)||'';const product=find(/商品说明|商品|备注|说明|摘要|description/i)||'';let desc=[counterparty,product].map(String).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' · ');if(amount===undefined)return null;amount=Number(String(amount).replace(/[￥¥,\s]/g,''));if(!Number.isFinite(amount)||amount===0)return null;const ds=String(direction).replace(/\s+/g,'');if(/支出|付款|消费|借方|debit/i.test(ds))amount=-Math.abs(amount);else if(/收入|收款|入账|贷方|credit/i.test(ds))amount=Math.abs(amount);const d=parseDate(time);if(!d)return null;return{source,file,time:d,amount:Math.round(amount*100)/100,desc,raw:row}}
function cluster(tx){const sorted=[...tx].sort((a,b)=>a.time-b.time),groups=[];for(const t of sorted){let best=null,bestDiff=Infinity;for(let i=groups.length-1;i>=0;i--){const g=groups[i],diff=Math.abs(t.time-g.anchor.time);if(diff>86400000&&t.time>g.anchor.time)break;if(Math.abs(t.amount-g.anchor.amount)<.001&&diff<bestDiff&&diff<=3600000&&!g.items.some(x=>x.source===t.source)){best=g;bestDiff=diff}}if(best)best.items.push(t);else groups.push({anchor:t,items:[t]})}return groups.map(g=>{const hasLedger=g.items.some(x=>x.source==='qianji'),external=g.items.some(x=>x.source!=='qianji');return{...g,status:hasLedger&&external?'matched':!hasLedger&&external?'missing':'ambiguous'}})}
function render(){const c=state.clusters;$('rawN').textContent=state.transactions.length;$('clusterN').textContent=c.length;$('matchedN').textContent=c.filter(x=>x.status==='matched').length;$('missingN').textContent=c.filter(x=>x.status!=='matched').length;const shown=c.filter(x=>state.filter==='all'||x.status===state.filter);$('results').className=shown.length?'':'empty';$('results').innerHTML=shown.length?shown.map(g=>{const a=g.anchor,sources=g.items.map(x=>`<span class="source">${x.source}</span>`).join('');return`<div class="tx"><span>${fmt(a.time)}</span><span class="amount">${a.amount<0?'-':'+'}¥${Math.abs(a.amount).toFixed(2)}</span><span>${esc(a.desc)||'<span class="muted">无描述</span>'}</span><span>${sources}</span><span class="status ${g.status}">${{matched:'已匹配',missing:'待处理',ambiguous:'疑似'}[g.status]}</span></div>`}).join(''):'没有这一类交易'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;render()});function fmt(d){return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
