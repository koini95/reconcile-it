<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconcile It v0.1.7</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>:root{font-family:Inter,"PingFang SC",system-ui,sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px 64px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:26px;margin:0}.ver{font-size:11px;color:#777;background:#ecece7;border-radius:999px;padding:3px 7px;margin-left:7px}.sub,.muted{color:#888;font-size:13px}.sub{margin-top:5px}.privacy{font-size:12px;color:#52745b;background:#e8f1e9;padding:7px 11px;border-radius:999px}.panel,.stat{background:#fff;border:1px solid #e7e7e2;border-radius:16px}.panel{padding:20px;margin-bottom:16px}.drop{border:1.5px dashed #c9c9c1;border-radius:12px;padding:24px;text-align:center}.drop strong{display:block;margin-bottom:8px}.picker{display:block;width:100%;font-size:16px;padding:12px;background:#f7f7f4;border-radius:9px;border:1px solid #ddd}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{background:#f3f3ef;border-radius:8px;padding:8px 10px;font-size:12px}.status{font-size:12px;color:#777;margin-top:10px}.actions{display:flex;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:10px 14px;font-weight:600}.primary{background:#20201e;color:#fff}.secondary{background:#efefeb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px}.num{font-size:25px;font-weight:700;margin-top:5px}.empty{text-align:center;padding:40px;color:#999}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.privacy{display:none}}</style></head>
<body><div class="wrap"><header><div><h1>Reconcile It <span class="ver">v0.1.7</span></h1><div class="sub">多源流水对账，不再造一本账。</div></div><div class="privacy">● Local only · 文件不会上传</div></header>
<section class="panel"><div class="drop"><strong>选择账单文件</strong><input id="picker" class="picker" type="file" multiple><div class="muted" style="margin-top:8px">钱迹 / 支付宝 / 微信 / 银行 · PDF / CSV / XLS / XLSX</div><div id="pickStatus" class="status">尚未选择文件</div></div><div id="files" class="files"></div><div class="actions"><button id="run" class="primary">开始对账</button><button id="clear" class="secondary">清空</button></div></section>
<section class="stats"><div class="stat"><span class="muted">原始记录</span><div id="rawN" class="num">0</div></div><div class="stat"><span class="muted">交易簇</span><div id="clusterN" class="num">0</div></div><div class="stat"><span class="muted">已匹配</span><div id="matchedN" class="num">0</div></div><div class="stat"><span class="muted">待处理</span><div id="missingN" class="num">0</div></div></section><section class="panel" style="margin-top:16px"><div id="results" class="empty">导入账单后开始对账</div></section></div>
<script>
/* Deliberately tiny ES5-compatible file-picker bootstrap. It runs independently of parsers/CDNs. */
window.__pickedFiles=[];
(function(){var p=document.getElementById('picker'),box=document.getElementById('files'),st=document.getElementById('pickStatus');function show(){var a=window.__pickedFiles,html=[];for(var i=0;i<a.length;i++)html.push('<span class="chip">'+a[i].name+' · '+Math.round(a[i].size/1024)+' KB</span>');box.innerHTML=html.join('');st.textContent=a.length?'已选择 '+a.length+' 个文件':'尚未选择文件'}p.onchange=function(){var fs=p.files;if(!fs||!fs.length){st.textContent='文件选择器返回了 0 个文件';return}for(var i=0;i<fs.length;i++){var dup=false;for(var j=0;j<window.__pickedFiles.length;j++)if(window.__pickedFiles[j].name===fs[i].name&&window.__pickedFiles[j].size===fs[i].size)dup=true;if(!dup)window.__pickedFiles.push(fs[i])}show()};window.__clearPicked=function(){window.__pickedFiles=[];p.value='';show()};window.addEventListener('error',function(e){st.textContent='页面脚本错误：'+(e.message||'unknown')})})();
</script>
<script>
(function(){var $=function(x){return document.getElementById(x)};function clean(x){return String(x==null?'':x).replace(/\s+/g,'').replace(/[：:]/g,'').trim()}function source(name,text){var s=(name+' '+(text||'')).toLowerCase();if(s.indexOf('微信')>=0||s.indexOf('wechat')>=0||s.indexOf('财付通')>=0)return'wechat';if(s.indexOf('支付宝')>=0||s.indexOf('alipay')>=0)return'alipay';if(s.indexOf('钱迹')>=0||s.indexOf('qianji')>=0)return'qianji';return'bank'}function money(v){var n=Number(String(v==null?'':v).replace(/[￥¥,元\s]/g,''));return isFinite(n)?n:null}function date(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'&&v>20000&&window.XLSX){var d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0))}var s=String(v==null?'':v).trim().replace(/[年月]/g,'/').replace('日','').replace(/\./g,'/'),m=s.match(/(20\d{2})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)):null}function val(r,re){for(var k in r)if(re.test(clean(k)))return r[k]}function make(r,src,file,time,amount,dir,desc){var d=date(time),n=money(amount);if(!d||n===null||n===0)return null;var a=Math.abs(n),ds=String(dir||'');if(/支出|付款|消费|借方/.test(ds))a=-a;else if(!/收入|收款|贷方/.test(ds))a=n;return{source:src,file:file,time:d,amount:Math.round(a*100)/100,desc:String(desc||'')}}function header(m){for(var i=0;i<Math.min(100,m.length);i++){var c=(m[i]||[]).map(clean);if(c.some(function(x){return/交易时间|日期|时间/.test(x)})&&c.some(function(x){return/金额/.test(x)}))return i}return-1}function objects(m,i){var h=m[i].map(function(x,j){return clean(x)||'__'+j});return m.slice(i+1).map(function(r){var o={};h.forEach(function(x,j){o[x]=r[j]==null?'':r[j]});return o})}function csvText(buf){var b=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){}try{return new TextDecoder('gb18030').decode(b)}catch(e){}return new TextDecoder().decode(b)}async function parseFile(f){if(!window.XLSX)throw new Error('XLSX 组件未加载');if(/\.pdf$/i.test(f.name))throw new Error('PDF 解析下一步单独恢复');var buf=await f.arrayBuffer(),csv=/\.csv$/i.test(f.name),wb=csv?XLSX.read(csvText(buf),{type:'string',raw:true}):XLSX.read(buf,{type:'array',raw:true,cellDates:true}),all=[],src='bank';for(var si=0;si<wb.SheetNames.length;si++){var sh=wb.Sheets[wb.SheetNames[si]],m=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:true});src=source(f.name,m.slice(0,50).flat().join(' '));var hi=header(m);if(hi<0)continue;var rows=objects(m,hi);for(var ri=0;ri<rows.length;ri++){var r=rows[ri],t,tm=val(r,/^交易时间$|交易时间|日期|^时间$/),am=val(r,/^金额|交易金额|支出金额|收入金额/),di=val(r,/^收\/?支$|收支|类型/),de=[val(r,/交易对方|商户|对方|名称/),val(r,/商品|备注|说明|摘要/)].filter(Boolean).join(' · ');t=make(r,src,f.name,tm,am,di,de);if(t)all.push(t)}}return{source:src,items:all}}function render(tx){$('rawN').textContent=tx.length;$('clusterN').textContent='—';$('matchedN').textContent='—';$('missingN').textContent='—';$('results').className='';$('results').innerHTML='<div style="padding:20px">已成功解析 <b>'+tx.length+'</b> 条。v0.1.7 先验证文件选择与读取链路，匹配逻辑下一步恢复。</div>'}$('clear').onclick=function(){window.__clearPicked();$('rawN').textContent='0';$('clusterN').textContent='0';$('matchedN').textContent='0';$('missingN').textContent='0';$('results').className='empty';$('results').textContent='导入账单后开始对账'};$('run').onclick=async function(){var fs=window.__pickedFiles.slice(),tx=[],st=$('pickStatus');if(!fs.length){st.textContent='没有收到文件，请先选择';return}st.textContent='正在读取 '+fs.length+' 个文件…';for(var i=0;i<fs.length;i++){try{var r=await parseFile(fs[i]);tx=tx.concat(r.items);st.textContent='已读取 '+(i+1)+'/'+fs.length+'：'+fs[i].name+' → '+r.items.length+' 条'}catch(e){st.textContent=fs[i].name+' 读取失败：'+e.message;return}}render(tx)}})();
</script></body></html>
