<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconcile It v0.1.5</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{font-family:Inter,"PingFang SC",system-ui,sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px 64px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:26px;margin:0}.ver{font-size:11px;color:#777;background:#ecece7;border-radius:999px;padding:3px 7px;vertical-align:middle;margin-left:7px}.sub,.muted{color:#888;font-size:13px}.sub{margin-top:5px}.privacy{font-size:12px;color:#52745b;background:#e8f1e9;padding:7px 11px;border-radius:999px}.panel,.stat{background:#fff;border:1px solid #e7e7e2;border-radius:16px}.panel{padding:20px;margin-bottom:16px}.drop{display:block;border:1.5px dashed #c9c9c1;border-radius:12px;padding:32px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}.drop strong{display:block;margin-bottom:6px}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{background:#f3f3ef;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.35}.chip small{display:block;color:#777;margin-top:2px}.ok{color:#477052!important}.bad{color:#a33!important}.actions{display:flex;gap:10px;margin-top:16px}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#20201e;color:#fff}.secondary{background:#efefeb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px}.num{font-size:25px;font-weight:700;margin-top:5px}.tabs{display:flex;gap:5px;margin-bottom:12px}.tab{background:transparent;color:#666}.tab.active{background:#e9e9e4;color:#111}.tx{display:grid;grid-template-columns:135px 100px 1fr 150px 90px;gap:8px;align-items:center;border-top:1px solid #eee;padding:13px 4px;font-size:13px}.amount{font-weight:700}.source{display:inline-block;padding:3px 7px;background:#f0f0ec;border-radius:6px;font-size:11px;margin:2px}.matched{color:#477052}.missing{color:#a33}.ambiguous{color:#9a6b22}.empty{text-align:center;padding:40px;color:#999}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tx{grid-template-columns:100px 85px 1fr}.tx>*:nth-child(4),.tx>*:nth-child(5){display:none}.privacy{display:none}}
</style></head><body><div class="wrap">
<header><div><h1>Reconcile It <span class="ver">v0.1.5</span></h1><div class="sub">多源流水对账，不再造一本账。</div></div><div class="privacy">● Local only · 文件不会上传</div></header>
<section class="panel"><label id="drop" class="drop" for="picker"><strong>把账单都拖进来</strong><span class="muted">钱迹 / 支付宝 / 微信 / 银行 · PDF / CSV / XLS / XLSX</span></label><input id="picker" type="file" multiple accept=".pdf,.csv,.xls,.xlsx,application/pdf" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><div id="files" class="files"></div><div class="actions"><button id="run" class="primary">开始对账</button><button id="clear" class="secondary">清空</button></div></section>
<section class="stats"><div class="stat"><span class="muted">原始记录</span><div id="rawN" class="num">0</div></div><div class="stat"><span class="muted">交易簇</span><div id="clusterN" class="num">0</div></div><div class="stat"><span class="muted">已匹配</span><div id="matchedN" class="num">0</div></div><div class="stat"><span class="muted">待处理</span><div id="missingN" class="num">0</div></div></section>
<section class="panel" style="margin-top:16px"><div class="tabs"><button class="tab active" data-filter="missing">待处理</button><button class="tab" data-filter="ambiguous">疑似</button><button class="tab" data-filter="matched">已匹配</button><button class="tab" data-filter="all">全部</button></div><div id="results" class="empty">导入账单后开始对账</div></section></div>
<script>
const S={files:[],stats:{},tx:[],clusters:[],filter:'missing'},$=x=>document.getElementById(x),key=f=>f.name+':'+f.size,clean=x=>String(x??'').replace(/\s+/g,'').replace(/[：:]/g,'').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drop=$('drop'),picker=$('picker');picker.onchange=e=>add(e.target.files);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>e.preventDefault()));drop.addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});function add(fs){for(const f of fs)if(!S.files.some(x=>key(x)===key(f)))S.files.push(f);renderFiles()}
function renderFiles(){$('files').innerHTML=S.files.map(f=>{const s=S.stats[key(f)];return `<span class="chip">${esc(f.name)}${s?`<small class="${s.count?'ok':'bad'}">${esc(s.source)} · 解析 ${s.count} 条 · ${esc(s.note)}</small>`:''}</span>`}).join('')}
$('clear').onclick=()=>{S.files=[];S.stats={};S.tx=[];S.clusters=[];picker.value='';renderFiles();render()};$('run').onclick=async()=>{S.tx=[];S.stats={};for(const f of S.files){try{const r=await parseFile(f);S.tx.push(...r.items);S.stats[key(f)]={source:r.source,count:r.items.length,note:r.note}}catch(e){S.stats[key(f)]={source:'读取失败',count:0,note:e.message||'未知错误'};console.error(e)}renderFiles()}S.clusters=cluster(S.tx);render()};
function source(name,text=''){const s=(name+' '+text).toLowerCase();if(s.includes('微信')||s.includes('wechat')||s.includes('财付通'))return'wechat';if(s.includes('支付宝')||s.includes('alipay'))return'alipay';if(s.includes('钱迹')||s.includes('qianji'))return'qianji';return'bank'}
function header(matrix){for(let i=0;i<Math.min(100,matrix.length);i++){const c=(matrix[i]||[]).map(clean);if(c.some(x=>/交易时间|日期|时间/.test(x))&&c.some(x=>/金额/.test(x)))return i}return-1}function objects(m,i){const h=m[i].map((x,j)=>clean(x)||'__'+j);return m.slice(i+1).map(r=>Object.fromEntries(h.map((x,j)=>[x,r[j]??''])))}
function csvText(buf){const b=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch{}try{return new TextDecoder('gb18030').decode(b)}catch{}return new TextDecoder().decode(b)}
async function parseFile(f){if(f.name.toLowerCase().endsWith('.pdf'))return{source:'bank/pdf',items:await parsePdf(f),note:'文本型 PDF'};const buf=await f.arrayBuffer(),csv=f.name.toLowerCase().endsWith('.csv'),wb=csv?XLSX.read(csvText(buf),{type:'string',raw:true}):XLSX.read(buf,{type:'array',raw:true,cellDates:true});let all=[],src='bank',found=false;for(const sn of wb.SheetNames){const m=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});src=source(f.name,m.slice(0,50).flat().join(' '));const hi=header(m);if(hi<0)continue;found=true;for(const r of objects(m,hi)){const t=src==='wechat'?parseWechat(r,f.name):src==='alipay'?parseAlipay(r,f.name):parseGeneric(r,src,f.name);if(t)all.push(t)}}return{source:src,items:all,note:found?'专用适配器':'未找到表头'}}
function val(r,re){for(const[k,v]of Object.entries(r))if(re.test(clean(k)))return v}function money(v){const n=Number(String(v??'').replace(/[￥¥,元\s]/g,''));return Number.isFinite(n)?n:null}function date(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return new Date(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0))}const s=String(v??'').trim().replace(/[年月]/g,'/').replace('日','').replace(/\./g,'/');const m=s.match(/(20\d{2})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)):null}
function make(r,src,file,time,amount,dir,desc){const d=date(time),n=money(amount);if(!d||n===null||n===0)return null;let a=Math.abs(n),ds=String(dir);if(/支出|付款|消费|借方/.test(ds))a=-a;else if(/收入|收款|贷方/.test(ds))a=Math.abs(a);else a=n;return{source:src,file,time:d,amount:Math.round(a*100)/100,desc:String(desc||''),raw:r}}
function parseWechat(r,f){return make(r,'wechat',f,val(r,/^交易时间$/),val(r,/^金额(?:\(元\)|（元）|元)?$/),val(r,/^收\/?支$|^收支$/),[val(r,/^交易对方$/),val(r,/^商品$/)].filter(Boolean).join(' · '))}
function parseAlipay(r,f){return make(r,'alipay',f,val(r,/^交易时间$/),val(r,/^金额(?:\(元\)|（元）|元)?$/),val(r,/^收\/?支$|^收支$/),[val(r,/^交易对方$/),val(r,/^商品说明$/)].filter(Boolean).join(' · '))}
function parseGeneric(r,src,f){return make(r,src,f,val(r,/交易时间|付款时间|创建时间|日期|^时间$/),val(r,/交易金额|支出金额|收入金额|^金额/),val(r,/收\/?支|收支|类型/),[val(r,/交易对方|商户|对方|名称/),val(r,/商品|备注|说明|摘要/)].filter(Boolean).join(' · '))}
async function parsePdf(f){const pdfjsLib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),c=await page.getTextContent(),items=c.items.filter(x=>x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5]})).sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);let rows=[],row=[],y=null;for(const i of items){if(y!==null&&Math.abs(i.y-y)>2){rows.push(row.join(' '));row=[]}row.push(i.s);y=i.y}if(row.length)rows.push(row.join(' '));for(const line of rows){const dm=line.match(/20\d{2}[\-\/.]\d{1,2}[\-\/.]\d{1,2}(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?/),mm=[...line.matchAll(/[-+]?\s*[¥￥]?\s*(?:\d{1,3}(?:,\d{3})*|\d+)\.\d{2}/g)];if(!dm||!mm.length)continue;let n=money(mm[0][0]);if(/支出|消费|付款|借方/.test(line))n=-Math.abs(n);out.push({source:'bank',file:f.name,time:date(dm[0]),amount:n,desc:line,raw:line})}}return out}
function cluster(tx){const a=[...tx].sort((x,y)=>x.time-y.time),g=[];for(const t of a){let b=null,bd=Infinity;for(let i=g.length-1;i>=0;i--){const x=g[i],d=Math.abs(t.time-x.anchor.time);if(d>86400000&&t.time>x.anchor.time)break;if(Math.abs(t.amount-x.anchor.amount)<.001&&d<=3600000&&d<bd&&!x.items.some(z=>z.source===t.source)){b=x;bd=d}}b?b.items.push(t):g.push({anchor:t,items:[t]})}return g.map(x=>{const q=x.items.some(z=>z.source==='qianji'),e=x.items.some(z=>z.source!=='qianji');return{...x,status:q&&e?'matched':!q&&e?'missing':'ambiguous'}})}
function render(){const c=S.clusters;$('rawN').textContent=S.tx.length;$('clusterN').textContent=c.length;$('matchedN').textContent=c.filter(x=>x.status==='matched').length;$('missingN').textContent=c.filter(x=>x.status!=='matched').length;const a=c.filter(x=>S.filter==='all'||x.status===S.filter);$('results').className=a.length?'':'empty';$('results').innerHTML=a.length?a.map(g=>{const x=g.anchor;return `<div class="tx"><span>${x.time.getMonth()+1}/${x.time.getDate()} ${String(x.time.getHours()).padStart(2,'0')}:${String(x.time.getMinutes()).padStart(2,'0')}</span><span class="amount">${x.amount<0?'-':'+'}¥${Math.abs(x.amount).toFixed(2)}</span><span>${esc(x.desc)||'无描述'}</span><span>${g.items.map(z=>`<span class="source">${z.source}</span>`).join('')}</span><span class="${g.status}">${{matched:'已匹配',missing:'待处理',ambiguous:'疑似'}[g.status]}</span></div>`}).join(''):'没有这一类交易'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.filter=b.dataset.filter;render()})}render();
</script></body></html>
